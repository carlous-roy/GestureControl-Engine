[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesturecontrol"
dynamic = ["version"]
description = "Webcam finger counting with MediaPipe, driving a 4-channel relay module over Firmata"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Roy Carlous Christudass" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Home Automation",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
# mediapipe depends on opencv-contrib-python, which provides cv2; no second
# OpenCV distribution is listed here so that only one package owns cv2.
# mediapipe < 0.10.30 ships the legacy Solutions API (bundled model);
# mediapipe >= 0.10.30 ships only the Tasks API (model fetched on first run).
# On macOS the 1.0.1 wheel aborts the process while building the hand
# landmarker graph (google-ai-edge/mediapipe#6356), so macOS stays on 1.0.0
# or the 0.10 line until a release fixes it.
dependencies = [
    'mediapipe>=0.10.14,<1.1; sys_platform != "darwin"',
    'mediapipe>=0.10.14,<1.0.1; sys_platform == "darwin"',
]

[project.optional-dependencies]
hardware = ["pyfirmata2>=2.5,<3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "numpy>=1.24",
    "pyfirmata2>=2.5,<3",
]

[project.scripts]
gesturecontrol = "gesturecontrol.cli:main"

[project.urls]
Homepage = "https://github.com/carlous-roy/GestureControl-Engine"
Demo = "https://gesture.roycarlous.com"

[tool.setuptools]
packages = ["gesturecontrol"]

[tool.setuptools.package-data]
gesturecontrol = ["rules.json", "data/*.json"]

[tool.setuptools.dynamic]
version = { attr = "gesturecontrol.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["demo", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "BLE", "PL"]
ignore = [
    "PLR2004", # magic numbers are the point of a rules-based classifier; they live in config
    "PLR0913", # explicit keyword arguments are preferred over option objects here
    "PLC0415", # optional hardware and vision imports are loaded lazily on purpose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR0915", "PLR0912"]

[tool.mypy]
# Checked as 3.12 because current numpy stubs use 3.12-only syntax (PEP 695 type
# statements) that mypy rejects under an older target. The 3.10 language baseline
# for the project's own code is enforced by ruff's target-version.
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["gesturecontrol", "tests", "simulation", "scripts", "main.py"]

[[tool.mypy.overrides]]
module = ["mediapipe", "mediapipe.*", "pyfirmata2", "pyfirmata2.*", "cv2", "cv2.*", "serial", "serial.*"]
ignore_missing_imports = true
